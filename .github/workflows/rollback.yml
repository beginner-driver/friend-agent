# 버튼 한 번으로 production(friend-agent)의 트래픽을 이전 리비전으로 되돌린다.
# 사용법: GitHub 저장소 > Actions > rollback > Run workflow. revision 을 비우면 지금 트래픽을 받는 리비전보다
#   먼저 만들어진, 정상(Ready)인 리비전 중 가장 최근 것으로 되돌린다. 이미지는 만들지 않고 트래픽 설정만 바꾼다.
# 인증은 deploy.yml 과 같은 저장소 공통 변수를 쓴다. 환경(environment)을 지정하지 않아 production 승인은 거치지 않는다.
name: rollback

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 되돌아갈 리비전 이름 (비우면 직전 정상 리비전)
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    env:
      SERVICE: friend-agent
      INPUT_REVISION: ${{ inputs.revision }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: 되돌아갈 리비전 정하기
        run: |
          CUR=$(gcloud run services describe "$SERVICE" --region us-central1 --project "${{ vars.GCP_PROJECT_ID }}" --format json | jq -r '.status.traffic | max_by(.percent) | .revisionName')
          if [ -n "$INPUT_REVISION" ]; then
            TARGET="$INPUT_REVISION"
          else
            CUR_TIME=$(gcloud run revisions describe "$CUR" --region us-central1 --project "${{ vars.GCP_PROJECT_ID }}" --format 'value(metadata.creationTimestamp)')
            TARGET=$(gcloud run revisions list --service "$SERVICE" --region us-central1 --project "${{ vars.GCP_PROJECT_ID }}" --format json | jq -r --arg t "$CUR_TIME" '[.[] | select(.metadata.creationTimestamp < $t) | select(any(.status.conditions[]; .type=="Ready" and .status=="True"))] | sort_by(.metadata.creationTimestamp) | last | .metadata.name')
          fi
          [ -n "$TARGET" ] && [ "$TARGET" != "null" ] || { echo "되돌아갈 리비전을 찾지 못했다"; exit 1; }
          echo "지금 트래픽을 받는 리비전: $CUR"
          echo "되돌아갈 리비전: $TARGET"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"

      - name: 롤백 (이전 리비전으로 100%)
        run: gcloud run services update-traffic "$SERVICE" --region us-central1 --project "${{ vars.GCP_PROJECT_ID }}" --to-revisions "$TARGET=100"

      - name: 롤백 결과
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region us-central1 --project "${{ vars.GCP_PROJECT_ID }}" --format 'value(status.url)')
          curl -fsS --max-time 60 --retry 3 --retry-all-errors "$URL/version"
